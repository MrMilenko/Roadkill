# Builds Roadkill for Windows, Linux and macOS on every push and pull request; a tag v* publishes
# the zips as a GitHub release. No game data is involved: the smoke test checks that each build
# starts and asks for the game files.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: ubuntu-24.04
            cmake: -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-w64-x86_64.cmake
          - name: linux-x64
            os: ubuntu-22.04
            cmake: ''
          - name: macos-universal
            os: macos-15
            cmake: "'-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64' -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0"
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Toolchain (Windows cross)
        if: matrix.name == 'windows-x64'
        run: sudo apt-get update && sudo apt-get install -y ninja-build gcc-mingw-w64-x86-64 zip

      - name: Toolchain (Linux)
        if: matrix.name == 'linux-x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build zip libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxi-dev libxss-dev libxfixes-dev libxkbcommon-dev libwayland-dev wayland-protocols \
            libdecor-0-dev libegl-dev libgl-dev libasound2-dev libpulse-dev libpipewire-0.3-dev \
            libudev-dev libdbus-1-dev

      - name: Toolchain (macOS)
        if: matrix.name == 'macos-universal'
        run: brew install ninja

      - name: Configure
        run: cmake -S . -B build-rel -G Ninja -DCMAKE_BUILD_TYPE=Release -DROADKILL_BUNDLED_SDL=ON ${{ matrix.cmake }}

      - name: Build
        run: cmake --build build-rel

      - name: Smoke test (starts, asks for the game files)
        if: matrix.name != 'windows-x64'
        run: |
          mkdir -p smoke/data && cp build-rel/roadkill smoke/
          set +e
          TM2_KEYS=1 SDL_VIDEODRIVER=dummy TM2_SETTINGS=$PWD/smoke/roadkill.ini ./smoke/roadkill 2> smoke/err.txt
          code=$?
          set -e
          cat smoke/err.txt
          test $code -eq 1 && grep -q "needs the files from your Twisted Metal 2" smoke/err.txt

      - name: Package
        run: ./scripts/package.sh build-rel ${{ matrix.name }}

      - uses: actions/upload-artifact@v4
        with:
          name: Roadkill-${{ matrix.name }}
          path: dist/*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=docs/releases/$GITHUB_REF_NAME.md
          if [ -f "$notes" ]; then set -- --notes-file "$notes"; else set -- --generate-notes; fi
          gh release create "$GITHUB_REF_NAME" dist/*.zip --repo "$GITHUB_REPOSITORY" --title "Roadkill $GITHUB_REF_NAME" "$@"
